name: C++ CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "*" ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Check code formatting
        run: |
          clang-format-18 --dry-run --Werror \
            $(find src/ include/ -name '*.cpp' -o -name '*.h')

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Upload dev build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: grade-dev
          path: build/grade

  build-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-name: grade-windows-x64.zip
          - os: macos-latest
            artifact-name: grade-macos-arm64.zip
          - os: ubuntu-latest
            artifact-name: grade-linux-x64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Recurse -Filter grade.exe |
            Compress-Archive -DestinationPath "${{ matrix.artifact-name }}"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: zip "${{ matrix.artifact-name }}" build/grade
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

  prerelease-build:
    if: github.ref_type != 'tag' && github.event_name == 'push'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact-name: grade-windows-x64.zip
          - os: macos-latest
            artifact-name: grade-macos-arm64.zip
          - os: ubuntu-latest
            artifact-name: grade-linux-x64.zip
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Recurse -Filter grade.exe |
            Compress-Archive -DestinationPath "${{ matrix.artifact-name }}"
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: zip "${{ matrix.artifact-name }}" build/grade
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

  prerelease:
    if: github.ref_type != 'tag' && github.event_name == 'push'
    needs: prerelease-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Update "latest" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          files: artifacts/*
          
  release:
    if: github.ref_type == 'tag'
    needs: [build, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*