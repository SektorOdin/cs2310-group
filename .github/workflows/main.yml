name: C++ CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install clang-format (for linting)
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      # Step 3: Run clang-format check (fails if formatting doesn't match)
      - name: Check code formatting
        run: |
          # Check all .cpp and .h files
          clang-format-18 --dry-run --Werror \
            $(find src/ include/ -name '*.cpp' -o -name '*.h')
      # Step 4: Configure CMake
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Step 5: Build the project
      - name: Build
        run: cmake --build build

      # Step 6: (Optional) Run tests when you add Catch2 later
      # - name: Run tests
      #   run: ctest --test-dir build --output-on-failure
